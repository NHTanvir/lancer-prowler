[package]
name = "lancer-prowler"
version = "0.1.0"
edition = "2021"
description = "Rust clone of prowler — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-prowler"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
comfy-table = "7.2"
indicatif = "0.17"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-iam = "1"
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
aws-types = "1"
aws-sdk-cloudtrail = "1"
aws-sdk-kms = "1"
aws-sdk-config = "1"
# aws-sdk-ec2 is excluded due to Windows MSVC stack overflow during compilation
# EC2 data is stubbed; enable on Linux by adding: aws-sdk-ec2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
